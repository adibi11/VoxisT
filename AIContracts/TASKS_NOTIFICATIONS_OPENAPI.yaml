openapi: 3.1.0
info:
  title: VoxisT Tasks and Notifications API
  version: 1.0.0-draft
  description: Task, comment, and reminder routes are implemented. Notification inbox, device, and preference routes remain planned until their persistence models are introduced.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /tasks:
    post:
      summary: Create a task
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Task' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
    get:
      summary: List visible tasks for a business
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses: { '200': { description: Tasks, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Task' } } } } } }
  /tasks/{id}:
    get:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' } ]
      responses: { '200': { $ref: '#/components/responses/Task' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTaskRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '412': { $ref: '#/components/responses/Error' } }
    delete:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedAction' } } } }
      responses: { '204': { description: Soft deleted }, '412': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/complete:
    post:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedAction' } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '409': { $ref: '#/components/responses/Error' }, '412': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/schedule:
    get:
      summary: Get the active schedule for a task
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' } ]
      responses: { '200': { description: Active task schedule, content: { application/json: { schema: { $ref: '#/components/schemas/TaskSchedule' } } } }, '404': { $ref: '#/components/responses/Error' } }
    put:
      summary: Create or replace the active recurring schedule for a task
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivateTaskScheduleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '412': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Deactivate the active schedule and stop future occurrence creation
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeactivateTaskScheduleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '412': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/cancel:
    post:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/VersionedAction' }, { type: object, properties: { cancellationReason: { type: string, maxLength: 1000 } } } ] } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '409': { $ref: '#/components/responses/Error' }, '412': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/comments:
    get:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' } ]
      responses: { '200': { description: Comments in chronological order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskComment' } } } } }, '404': { $ref: '#/components/responses/Error' } }
    post:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskCommentRequest' } } } }
      responses: { '201': { description: Comment, content: { application/json: { schema: { $ref: '#/components/schemas/TaskComment' } } } } }
  /tasks/{id}/comments/{commentId}:
    patch:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { name: commentId, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskCommentRequest' } } } }
      responses: { '200': { description: Comment, content: { application/json: { schema: { $ref: '#/components/schemas/TaskComment' } } } } }
    delete:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/TaskId' }, { name: commentId, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
      responses: { '204': { description: Comment soft deleted }, '404': { $ref: '#/components/responses/Error' } }
  /notifications:
    x-implementation-status: planned
    get:
      summary: List notification inbox items
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses: { '200': { description: Notification list } }
  /notifications/{id}/read:
    x-implementation-status: planned
    post:
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
      responses: { '204': { description: Marked read } }
  /me/devices:
    x-implementation-status: planned
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeviceRequest' } } } }
      responses: { '201': { description: Device registered } }
  /me/devices/{deviceId}:
    x-implementation-status: planned
    delete:
      parameters: [ { name: deviceId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } } ]
      responses: { '204': { description: Device removed } }
  /me/notification-preferences:
    x-implementation-status: planned
    get: { responses: { '200': { description: Preferences } } }
    patch:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateNotificationPreferencesRequest' } } } }
      responses: { '200': { description: Preferences updated } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    BusinessId: { name: X-Business-Id, in: header, required: true, schema: { type: integer, minimum: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    TaskId: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    Task: { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    CreateTaskRequest:
      type: object
      required: [headline, description, mainAssigneeUserId, timezone]
      properties:
        headline: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
        category: { type: [string, 'null'], maxLength: 100 }
        mainAssigneeUserId: { type: integer, minimum: 1 }
        listenerUserIds: { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
        leadId: { type: [integer, 'null'], minimum: 1 }
        startsAt: { type: [string, 'null'], format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        isAllDay: { type: boolean, default: false }
        timezone: { type: string, minLength: 1 }
        schedule: { anyOf: [ { $ref: '#/components/schemas/TaskScheduleRequest' }, { type: 'null' } ] }
    UpdateTaskRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        headline: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        category: { type: [string, 'null'], maxLength: 100 }
        leadId: { type: [integer, 'null'], minimum: 1 }
        startsAt: { type: [string, 'null'], format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        isAllDay: { type: boolean }
        timezone: { type: string, minLength: 1 }
        mainAssigneeUserId: { type: integer, minimum: 1 }
        listenerUserIds: { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
        schedule: { anyOf: [ { $ref: '#/components/schemas/TaskScheduleRequest' }, { type: 'null' } ] }
    VersionedAction: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer, minimum: 1 } } }
    TaskScheduleRequest:
      type: object
      required: [rrule, timezone]
      properties:
        rrule: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1 }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        occurrenceDueOffsetMinutes: { type: [integer, 'null'], minimum: 0 }
    ActivateTaskScheduleRequest:
      allOf:
        - $ref: '#/components/schemas/TaskScheduleRequest'
        - type: object
          required: [expectedVersion, nextOccurrenceAt]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
            nextOccurrenceAt: { type: string, format: date-time }
    DeactivateTaskScheduleRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    TaskSchedule:
      type: object
      required: [id, rrule, timezone, isActive, startsAt, endsAt, nextOccurrenceAt, occurrenceDueOffsetMinutes]
      properties:
        id: { type: integer, minimum: 1 }
        rrule: { type: string }
        timezone: { type: string }
        isActive: { type: boolean }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        nextOccurrenceAt: { type: [string, 'null'], format: date-time }
        occurrenceDueOffsetMinutes: { type: [integer, 'null'] }
    CreateTaskCommentRequest: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 10000 } } }
    RegisterDeviceRequest:
      type: object
      required: [deviceId, operatingSystem, fcmToken, appVersion, locale]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 255 }
        operatingSystem: { type: string, enum: [IOS, ANDROID] }
        fcmToken: { type: string, minLength: 1, maxLength: 4096 }
        appVersion: { type: string, minLength: 1, maxLength: 64 }
        locale: { type: string, minLength: 1, maxLength: 35 }
    UpdateNotificationPreferencesRequest:
      type: object
      required: [enabledEventTypes, channels, timezone]
      properties:
        enabledEventTypes: { type: array, uniqueItems: true, items: { type: string, enum: [TASK_ASSIGNED, TASK_REMINDER, TASK_COMMENT, TASK_COMPLETED, TASK_CANCELLED] } }
        channels: { type: array, uniqueItems: true, items: { type: string, enum: [PUSH] } }
        timezone: { type: string, minLength: 1 }
    Task: { type: object, required: [id, businessId, headline, description, status, priority, timezone, mainAssignee, listeners, version, permissions] }
    TaskComment: { type: object, required: [id, taskId, body, author, createdAt, updatedAt, isDeleted] }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        currentVersion: { type: integer }
