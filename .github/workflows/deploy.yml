name: Voxis Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      api_changed: ${{ steps.filter.outputs.api }}
      worker_changed: ${{ steps.filter.outputs.worker }}
      outbound_changed: ${{ steps.filter.outputs.outbound }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'versions/api.json'
            worker:
              - 'versions/worker.json'
            outbound:
              - 'versions/outbound.json'

      - name: Debug repository
        run: |
          pwd
          ls -la
          ls -la versions

  deploy-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read API version
        id: read_api_version
        run: |
          ls -la versions
          API_VERSION=$(jq -r '.version' versions/api.json)
          echo "API_VERSION=$API_VERSION" >> $GITHUB_OUTPUT
          echo "API version is $API_VERSION"

      - name: Deploy API
        run: echo "Deploying API version ${{ steps.read_api_version.outputs.API_VERSION }}..."

  deploy-message-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.worker_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Worker version
        id: read_worker_version
        run: |
          ls -la versions
          WORKER_VERSION=$(jq -r '.version' versions/worker.json)
          echo "WORKER_VERSION=$WORKER_VERSION" >> $GITHUB_OUTPUT
          echo "Worker version is $WORKER_VERSION"

      - name: Deploy Worker
        run: echo "Deploying Worker version ${{ steps.read_worker_version.outputs.WORKER_VERSION }}..."

  deploy-outbound:
    needs: detect-changes
    if: needs.detect-changes.outputs.outbound_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Outbound version
        id: read_outbound_version
        run: |
          ls -la versions
          OUTBOUND_VERSION=$(jq -r '.version' versions/outbound.json)
          echo "OUTBOUND_VERSION=$OUTBOUND_VERSION" >> $GITHUB_OUTPUT
          echo "Outbound version is $OUTBOUND_VERSION"

      - name: Deploy Outbound
        run: echo "Deploying Outbound version ${{ steps.read_outbound_version.outputs.OUTBOUND_VERSION }}..."